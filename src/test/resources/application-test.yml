spring:
  datasource:
    url: jdbc:h2:mem:question_bank;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  token-ttl: PT1H
  rate-limit:
    capacity: 10000
    window: PT1M
