# 题库应用：Deployment + Service + HPA。
# 探针走 /actuator/health/{readiness,liveness}——SecurityConfig 已放行 health/**（CI 镜像冒烟修复的缺陷在 K8s 探针上再次闭环）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: question-bank
  labels: { app: question-bank }
spec:
  replicas: 1
  selector:
    matchLabels: { app: question-bank }
  template:
    metadata:
      labels: { app: question-bank }
    spec:
      containers:
        - name: app
          image: question-bank:ci
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/question_bank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true"
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-secret, key: MYSQL_ROOT_PASSWORD }
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1500m"
              memory: 1Gi
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: question-bank
spec:
  selector: { app: question-bank }
  ports:
    - port: 8080
      targetPort: 8080
---
# HPA：CPU 70% 触发扩容（1→3）。需要 metrics-server（CI 里 kind 会装）。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: question-bank
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: question-bank
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
