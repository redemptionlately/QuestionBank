name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: 编译 · 测试 · 覆盖率 · 真实 MySQL 证据
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0
        env:
          MYSQL_ROOT_PASSWORD: 783421
          MYSQL_DATABASE: question_bank
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p783421"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

      kafka:
        image: apache/kafka:4.0.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 等待 Kafka broker 就绪
        run: |
          for i in $(seq 1 40); do
            if docker exec "$(docker ps -q --filter ancestor=apache/kafka:4.0.0)" \
               /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1; then
              echo "kafka ready (attempt $i)"; break
            fi
            [ "$i" = 40 ] && { echo "kafka 未就绪"; exit 1; }
            sleep 3
          done

      - name: 单元与集成测试（全证据环境）+ 覆盖率门禁
        env:
          REDIS_EVIDENCE: "true"
          KAFKA_EVIDENCE: "true"
          MYSQL_EVIDENCE: "true"
          MYSQL_PASSWORD: "783421"
          DB_URL: "jdbc:mysql://127.0.0.1:3306/question_bank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true"
          DB_USERNAME: root
        run: |
          ./mvnw -B verify 2>&1 | tee build.log
          if ! grep -aq "BUILD SUCCESS" build.log; then
            echo "===== ERROR LINES ====="
            grep -aE "\[ERROR\]" build.log | head -8
            echo "===== RULE / SUMMARY ====="
            grep -aE "Rule violated|Tests run: [0-9]+, Failures: [1-9]|Errors: [1-9]|BUILD FAILURE" build.log | head -2
            echo "===== TAIL ====="
            tail -10 build.log
            { grep -aE "\[ERROR\]" build.log | head -4
              grep -aE "Rule violated|Tests run: [0-9]+, Failures: [1-9]|Errors: [1-9]|BUILD FAILURE" build.log | head -3
              tail -3 build.log
            } | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: 真实 MySQL 证据测试（EXPLAIN / 隔离级别 / 行锁）
        env:
          MYSQL_EVIDENCE: "true"
          MYSQL_PASSWORD: "783421"
          DB_URL: "jdbc:mysql://127.0.0.1:3306/question_bank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          DB_USERNAME: root
        run: ./mvnw -B test -Dtest=MysqlRealDbIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/target/site/jacoco

      - name: 打包可执行 jar
        run: ./mvnw -B -DskipTests package

      - name: 构建镜像验证（多阶段构建 + 非 root + 探针冒烟）
        run: |
          docker build -t question-bank:ci .
          echo "镜像体积: $(docker images question-bank:ci --format '{{.Size}}')"
          docker run -d --name smoke --add-host=host.docker.internal:host-gateway \
            -e DB_URL="jdbc:mysql://host.docker.internal:3306/question_bank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" \
            -e DB_USERNAME=root -e DB_PASSWORD=783421 \
            -p 8080:8080 question-bank:ci
          for i in $(seq 1 40); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/actuator/health/readiness)" = "200" ]; then
              echo "容器 readiness OK (attempt $i)"; break
            fi
            [ "$i" = 40 ] && { echo "容器冒烟失败"; docker logs smoke 2>&1 | tail -40; exit 1; }
            sleep 3
          done
          echo "health: $(curl -s http://127.0.0.1:8080/actuator/health)"
          echo "HEALTHCHECK 状态: $(docker inspect --format '{{.State.Health.Status}}' smoke)"
          docker inspect --format 'user={{.Config.User}}' smoke
          docker rm -f smoke

  cloud-compile:
    name: Spring Cloud 拆分编译门禁（cloud/ 六模块）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # cloud 是独立聚合构建（不并入根聚合的 JaCoCo 门禁），运行时证据在本机
      # scripts/cloud-evidence.sh 拉起 5 进程做 10 项 curl 取证；CI 只保证编译不腐化
      - name: 编译 cloud 六模块
        run: |
          ./mvnw -B -f cloud/pom.xml package -DskipTests 2>&1 | tee cloud_build.log
          grep -aq "BUILD SUCCESS" cloud_build.log

  k8s-deploy:
    name: K8s kind 集群部署验证（含探针 / HPA）
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: 创建 kind 集群
        uses: helm/kind-action@v1
        with:
          cluster_name: question-bank

      - name: 构建镜像并载入 kind
        run: |
          docker build -t question-bank:ci .
          kind load docker-image question-bank:ci --name question-bank

      - name: 安装 metrics-server（kind 需要跳过 TLS 校验）
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl patch deployment metrics-server -n kube-system --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'

      - name: 部署全部 K8s 资源（MySQL + 应用 + HPA）
        run: kubectl apply -f deploy/k8s/

      - name: 等待 MySQL 就绪
        run: kubectl rollout status deployment/mysql --timeout=240s

      - name: 等待应用就绪（readiness 探针通过 = Flyway 首次迁移完成）
        run: kubectl rollout status deployment/question-bank --timeout=420s

      - name: 冒烟验证（探针 / 服务发现 / HPA 状态）
        run: |
          kubectl get pods -o wide
          APP_POD="$(kubectl get pods -l app=question-bank -o jsonpath='{.items[0].metadata.name}')"
          echo "readiness: $(kubectl exec "$APP_POD" -- curl -fsS http://localhost:8080/actuator/health/readiness)"
          echo "liveness:  $(kubectl exec "$APP_POD" -- curl -fsS http://localhost:8080/actuator/health/liveness)"
          echo "业务库表（Flyway 迁移证据）: $(kubectl exec "$APP_POD" -- curl -fsS -H 'X-Demo: 1' http://localhost:8080/actuator/health 2>/dev/null | head -c 200)"
          kubectl get svc mysql question-bank
          kubectl get hpa question-bank
          # HPA 指标就绪验证：metrics-server 装好后 TARGETS 不应停留在 <unknown>
          for i in $(seq 1 24); do
            TARGETS="$(kubectl get hpa question-bank -o jsonpath='{.status.currentMetrics[*].resource.current.averageUtilization}' 2>/dev/null)"
            [ -n "$TARGETS" ] && [ "$TARGETS" != "" ] && { echo "HPA 指标已就绪 (CPU=${TARGETS}%)"; break; }
            [ "$i" = 24 ] && echo "HPA 指标 2 分钟未就绪（metrics-server 未生效）"; [ "$i" = 24 ] && exit 1
            sleep 5
          done
