name: Mutation

on:
  # 代码/构建/工作流文件变更时跑（纯文档提交不触发）
  push:
    paths:
      - ".github/workflows/mutation.yml"
      - "app/pom.xml"
      - "app/src/main/**"
      - "app/src/test/**"
  # 每周一 02:00 UTC（北京 10:00）定时兜底，防止断言静默腐化
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  pit:
    name: PIT 变异测试（event/common/importjob 三包，强度门禁 85%）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # PIT 只跑纯单元测试（7 个 targetTests 类），不需要 mysql/redis/kafka 服务容器；
      # 证据门控测试在 test 阶段按环境变量缺失自动跳过。
      #
      # 必须两步走——2026-09-09 云端两轮实锤，别合并回 `-pl app -am` 单条：
      # ① CLI 直接调 goal 会生成 default-cli execution，Maven 对 reactor 里【每个模块】都执行它。
      #    `-pl app -am` 会把 monitor-spring-boot-starter 拉进 reactor，而该模块没声明 pitest 插件
      #    → Maven 解析到 1.30.0（不是 app/pom.xml 声明的 1.16.3）且不带 pitest-junit5-plugin
      #    → "Please check you have correctly installed the pitest plugin for your project's test library"
      #    （本地复现：output/pit_am_repro_20260909.log；云端 run 34345585631）
      # ② 预装那一步也不能写成 `-pl app -am install`：jacoco-check 绑在 verify，
      #    -DskipTests 会让覆盖率归零直接挂。只装 monitor-starter（+ 父 POM）即可满足 app 的 SNAPSHOT 依赖。
      - name: 预装 reactor 内部依赖（monitor-starter SNAPSHOT）
        run: ./mvnw -B -pl monitor-starter -am install -DskipTests

      - name: 运行 PIT 变异测试（reactor 只留 app 一个模块）
        run: |
          ./mvnw -B -pl app test org.pitest:pitest-maven:mutationCoverage 2>&1 | tee pit.log
          grep -aq "BUILD SUCCESS" pit.log
          # 版本防漂移：goal 一旦又被扩散到未声明插件的模块，版本会漂到 latest（1.30.0），
          # 这里把 POM 声明的 1.16.3 钉死成硬断言
          grep -aq "pitest:1.16.3:mutationCoverage" pit.log || {
            echo "PIT 插件版本漂移：未见到 pitest:1.16.3:mutationCoverage"; exit 1; }

      # 双口径守门：pom 的 mutationThreshold=45 守 killed/total 底线；
      # 这里对 "Test strength"（killed/有覆盖变异）做 ≥85 硬断言——
      # 它才是"断言能不能挡住错误"的真指标（2026-09-09 实测 90%）
      - name: 变异强度硬断言（Test strength ≥ 85）
        run: |
          STRENGTH=$(grep -aoE "Test strength [0-9]+%" pit.log | grep -oE "[0-9]+" | head -1)
          echo "Test strength = ${STRENGTH}%"
          [ -n "$STRENGTH" ] || { echo "未解析到 Test strength 行"; exit 1; }
          [ "$STRENGTH" -ge 85 ] || { echo "变异强度 ${STRENGTH}% 低于 85% 门禁"; exit 1; }

      - name: 上传变异报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: app/target/pit-reports/
