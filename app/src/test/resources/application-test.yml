spring:
  datasource:
    url: jdbc:h2:mem:question_bank;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  token-ttl: PT1H
  rate-limit:
    capacity: 10000
    window: PT1M
  import:
    retry:
      # 测试上下文直接关掉重试清扫：跑得久的集成测试（>60s）不应被定时清扫扰动状态
      enabled: false
