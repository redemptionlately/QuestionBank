spring:
  application:
    name: question-bank-m0
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/question_bank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:question_bank}
    password: ${DB_PASSWORD:question_bank}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    validate-on-migrate: true
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
server:
  error:
    include-message: never
app:
  token-ttl: PT8H
  security:
    # BCrypt strength（4-31 合法）：调之前先跑 scripts/bcrypt-strength-benchmark.sh 拿数据
    bcrypt-strength: 10
  mybatis:
    slow-sql-threshold-ms: 1000
  rate-limit:
    capacity: 300
    window: PT1M
